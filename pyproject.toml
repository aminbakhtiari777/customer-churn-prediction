[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "customer-churn-mlops-api"
version = "1.0.0"
description = "Reproducible customer churn training pipeline and FastAPI service"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "joblib>=1.4,<2",
  "pandas>=2.2,<3",
  "pydantic>=2.9,<3",
  "scikit-learn>=1.5,<2",
  "uvicorn[standard]>=0.30,<1",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
